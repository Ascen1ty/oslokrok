plugins { id 'com.android.application' }

android {
    namespace 'net.oslokrok.hook'
    compileSdk 34

    defaultConfig {
        applicationId 'net.oslokrok.hook'
        minSdk 26
        targetSdk 34
        versionCode (project.hasProperty('vCode') ? project.vCode.toInteger() : 1)
        versionName (project.hasProperty('vName') ? project.vName.toString().replaceFirst('^v','') : '1.0')
        // arm64-v8a
        ndk { abiFilters '' }
    }

    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : null
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed.
    compileOnly 'de.robv.android.xposed:api:82'
    // DexKit native lib + flatbuffers + kotlin-stdlib.
    implementation 'org.luckypray:dexkit:2.3.0'
	implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
}
